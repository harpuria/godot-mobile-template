[app]
name="godot-mobile-template"
version="0.1.0"
android_package="com.example.mobiletemplate"
ios_bundle="com.example.mobiletemplate"
orientation="sensor"
main_scene="res://scenes/main.tscn"
; App.initialize() 전에 before_app_initialize()를 한 번 호출할 RefCounted script. 비어 있으면 생략한다.
init_script=""

[features]
ads_enabled=true
iap_enabled=true
analytics_enabled=true
privacy_enabled=true
review_enabled=true
game_services_enabled=true

[services]
mode="mock"
allow_mobile_debug_mocks=true

[save]
autosave_seconds=30.0

[ads]
android_mode="inherit"
android_native_verified=false
use_test_ads=true
test_device_ids=[]
retry_seconds=30.0
android_app_id=""
ios_app_id=""
rewarded_unit_id=""
interstitial_unit_id=""
banner_unit_id=""

[billing]
android_mode="inherit"
android_native_verified=false
timeout_seconds=120.0
android_product_ids={}

[privacy]
tag_for_under_age_of_consent=false

[game_services]
android_game_id=""
android_mode="inherit"
; 네이티브 export 및 기기 검증 완료 후에만 true로 변경한다.
android_native_verified=false
ios_native_verified=false
timeout_seconds=120.0
leaderboard_ids={"DEMO_SCORE": {"android": "", "ios": ""}}
achievement_ids={"DEMO_FIRST_WIN": {"android": "", "ios": ""}}
