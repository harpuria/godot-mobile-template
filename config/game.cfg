[app]
name="godot-mobile-template"
version="0.1.0"
; 스토어 제출마다 1씩 올린다. Android version code와 iOS build number로 반영된다.
build_number=1
android_package="com.example.mobiletemplate"
ios_bundle="com.example.mobiletemplate"
orientation="sensor"
main_scene="res://scenes/main.tscn"
; App.initialize() 전에 before_app_initialize()를 한 번 호출할 RefCounted script. 비어 있으면 생략한다.
init_script=""

[features]
ads_enabled=true
iap_enabled=true
analytics_enabled=true
privacy_enabled=true
review_enabled=true
game_services_enabled=true

[services]
mode="mock"
allow_mobile_debug_mocks=true

[save]
autosave_seconds=30.0
; 저장 load 실패 시 bootstrap이 기본 복구 팝업을 띄운다. 게임이 직접 처리하면 false.
recovery_popup=true

[ads]
android_mode="inherit"
android_native_verified=false
use_test_ads=true
test_device_ids=[]
retry_seconds=30.0
android_app_id=""
ios_app_id=""
rewarded_unit_id=""
interstitial_unit_id=""
banner_unit_id=""

[billing]
android_mode="inherit"
android_native_verified=false
timeout_seconds=120.0
android_product_ids={}
; ONE store 빌드(custom feature onestore)의 상품 ID override. products.json의 onestore 키보다 우선한다.
onestore_product_ids={}
; ONE store 개발자 센터의 라이선스 공개 키. 실제 값은 config/android.local.cfg에 둔다.
onestore_public_key=""

[privacy]
tag_for_under_age_of_consent=false

[game_services]
android_game_id=""
android_mode="inherit"
; 네이티브 export 및 기기 검증 완료 후에만 true로 변경한다.
android_native_verified=false
ios_native_verified=false
timeout_seconds=120.0
leaderboard_ids={"DEMO_SCORE": {"android": "", "ios": ""}}
achievement_ids={"DEMO_FIRST_WIN": {"android": "", "ios": ""}}
